name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag for reference (e.g. v1.0.0); manual runs always upload Actions artifacts.'
        required: false

permissions:
  contents: write

jobs:
  build-mac-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Package (macOS arm64)
        run: pnpm exec electron-builder --mac dmg zip --arm64 --publish "$PUBLISH_MODE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ github.event_name == 'push' && 'always' || 'never' }}
      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomi-mac-arm64
          path: |
            release/*arm64*.dmg
            release/*arm64*.zip
            release/*arm64*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  build-win:
    name: Build Windows (x64)
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Package (Windows x64)
        run: pnpm exec electron-builder --win nsis --x64 --publish "$env:PUBLISH_MODE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ github.event_name == 'push' && 'always' || 'never' }}
      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomi-windows-x64
          path: |
            release/*x64*.exe
            release/*x64*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish-aliases:
    name: Publish stable-name aliases
    needs: [build-mac-arm64, build-win]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Download and re-upload with stable names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern "*.dmg" --pattern "*.exe" --dir ./artifacts
          ls artifacts/
          # Rename to stable names
          for f in artifacts/*arm64*.dmg; do cp "$f" artifacts/Nomi-mac-arm64.dmg 2>/dev/null || true; done
          for f in artifacts/*x64*.exe; do cp "$f" artifacts/Nomi-windows-x64-setup.exe 2>/dev/null || true; done
          # Upload stable-name aliases
          gh release upload "$TAG" artifacts/Nomi-mac-arm64.dmg --clobber 2>/dev/null || true
          gh release upload "$TAG" artifacts/Nomi-windows-x64-setup.exe --clobber 2>/dev/null || true
